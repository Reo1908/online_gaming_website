# Kompletter Stack, so wie er auf einem Server laufen wuerde.
#
#   docker compose -f compose.prod.yml up -d --build
#
# Werte kommen aus der .env im selben Verzeichnis (siehe .env.example).
# Fuer die taegliche Entwicklung weiter compose.yml + npm run dev benutzen --
# das ist beim Neuladen deutlich schneller.

services:
  db:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Bewusst kein `ports`: die Datenbank ist nur im internen Compose-Netz
    # erreichbar. Alles andere wuerde Postgres offen ins Netz haengen.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # Die API startet ihre Migrationen sofort -- ohne diese Pruefung
      # laeuft sie gegen eine Datenbank, die noch gar nicht bereit ist.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped

    environment:
      # `db` ist der Dienstname oben und zugleich der Hostname im Netz.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      NODE_ENV: production
      PORT: 3000

    depends_on:
      db:
        condition: service_healthy

    # Ebenfalls kein `ports`: erreichbar nur ueber nginx im web-Dienst.
    expose:
      - '3000'

  web:
    build:
      context: ./apps/web
    restart: unless-stopped

    ports:
      - '${WEB_PORT:-8080}:80'

    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
