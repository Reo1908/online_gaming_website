<!-- Liegt hinter dem Inhalt und faerbt die ganze Flaeche, obwohl die
     Anmeldeseite selbst nur so breit wie die Card ist. -->
<div class="backdrop" aria-hidden="true"></div>

<div class="wrap">
  <p-card styleClass="login-card">
    <ng-template #header>
      <div class="card-head">
        <div class="badge"><i class="pi pi-users"></i></div>
        <h1>Willkommen zurück</h1>
        <p>Melde dich an, um mitzuspielen.</p>
      </div>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (error(); as message) {
        <p-message severity="error" [text]="message" styleClass="full" />
      }

      <div class="field">
        <label for="username">Benutzername</label>
        <input
          pInputText
          id="username"
          formControlName="username"
          autocomplete="username"
          [fluid]="true"
          autofocus
        />
      </div>

      <div class="field">
        <label for="password">Passwort</label>
        <!-- toggleMask blendet das Auge zum Aufdecken ein; die
             Staerke-Anzeige waere beim Anmelden dagegen sinnlos. -->
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          [fluid]="true"
          autocomplete="current-password"
        />
      </div>

      <p-button
        type="submit"
        label="Anmelden"
        icon="pi pi-sign-in"
        [loading]="busy()"
        [disabled]="form.invalid"
        styleClass="submit"
      />
    </form>

    <ng-template #footer>
      <p class="note">
        <i class="pi pi-info-circle"></i>
        Konten werden von einem Administrator angelegt. Eine Selbstregistrierung
        gibt es nicht.
      </p>
    </ng-template>
  </p-card>
</div>
