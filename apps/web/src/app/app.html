<header class="topbar">
  <a class="brand" routerLink="/">Friend<span>Games</span></a>

  <nav class="nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Start</a>

    @if (auth.isLoggedIn()) {
      <a routerLink="/profile" routerLinkActive="active">Profil</a>
    }

    <!-- Nur ausgeblendet, nicht geschuetzt: die Absicherung passiert im Backend. -->
    @if (auth.isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active">Administration</a>
    }
  </nav>

  <div class="session">
    @if (auth.user(); as user) {
      <span class="who">
        {{ user.displayName }}
        <span class="role" [class.is-admin]="user.role === 'ADMIN'">{{ user.role }}</span>
      </span>
      <p-button label="Abmelden" severity="secondary" size="small" (onClick)="logout()" />
    } @else {
      <p-button label="Anmelden" size="small" routerLink="/login" />
    }
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
