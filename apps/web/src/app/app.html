<header class="topbar">
  @if (auth.isLoggedIn()) {
    <a class="brand" routerLink="/">Friend<span>Games</span></a>
  } @else {
    <!-- Ohne Anmeldung fuehrt der Verweis nirgendwohin: es gibt nur /login. -->
    <span class="brand">Friend<span>Games</span></span>
  }

  <nav class="nav">
    @if (auth.isLoggedIn()) {
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Start
      </a>
      <a routerLink="/leaderboard" routerLinkActive="active">Rangliste</a>
      <a routerLink="/profile" routerLinkActive="active">Profil</a>
    }

    <!-- Nur ausgeblendet, nicht geschuetzt: die Absicherung passiert im Backend. -->
    @if (auth.isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active">Administration</a>
      <a routerLink="/status" routerLinkActive="active">Status</a>
    }
  </nav>

  <div class="session">
    @if (auth.user(); as user) {
      <span class="who">
        {{ user.displayName }}
        <span class="role" [class.is-admin]="user.role === 'ADMIN'">{{ user.role }}</span>
      </span>
      <p-button label="Abmelden" severity="secondary" size="small" (onClick)="logout()" />
    }
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
