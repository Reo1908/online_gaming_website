# Nur wenn der Browser den Wechsel anfragt, wird er angestossen. Fest
# verdrahtetes "upgrade" ginge sonst bei jeder gewoehnlichen Anfrage mit
# raus und beendet die Keepalive-Verbindung zum Backend.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Angular liefert bereits minimierte Dateien; gzip spart trotzdem deutlich.
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Verraet sonst die nginx-Version an jeden Besucher.
    server_tokens off;

    # Sicherheits-Header. Achtung: add_header wird NICHT vererbt, sobald ein
    # location-Block selbst eines setzt -- deshalb stehen sie unten in den
    # beiden betroffenen Bloecken noch einmal.
    add_header X-Content-Type-Options nosniff            always;
    add_header X-Frame-Options        DENY               always;
    add_header Referrer-Policy        no-referrer        always;

    # ------------------------------------------------------------------
    # Backend. Entscheidend fuer die Anmeldung: Browser und API liegen
    # dadurch auf derselben Origin. Das Session-Cookie ist SameSite=Lax --
    # wuerde das Frontend die API unter einem anderen Host ansprechen,
    # sendete der Browser es bei keinem Seitenwechsel mehr mit.
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Ohne diesen Header haelt das Backend hinter einem HTTPS-Proxy
        # jede Verbindung faelschlich fuer unverschluesselt.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vorbereitet fuer die spaetere Socket.IO-Anbindung.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
    }

    # Dateinamen enthalten einen Inhalts-Hash, koennen also unbegrenzt
    # zwischengespeichert werden.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff     always;
        add_header X-Frame-Options        DENY        always;
        add_header Referrer-Policy        no-referrer always;
        try_files  $uri =404;
    }

    # index.html darf nie zwischengespeichert werden, sonst laedt der Browser
    # nach einem Deploy weiter die Verweise auf die alten, geloeschten Dateien.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff     always;
        add_header X-Frame-Options        DENY        always;
        add_header Referrer-Policy        no-referrer always;
    }

    # Single Page Application: /admin und /profile existieren nur im Router,
    # nicht als Datei. Ohne diese Zeile liefert ein Neuladen dort einen 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
