# Fuer den Server: zieht fertige Images aus der Registry, statt zu bauen.
# Auf dem Zielrechner werden nur diese Datei und eine .env gebraucht --
# kein Quelltext, kein Node, kein Compiler.
#
#   docker compose -f compose.deploy.yml pull
#   docker compose -f compose.deploy.yml up -d
#
# IMAGE_TAG in der .env steuert, welche Version laeuft. Ein Zurueckrollen
# ist damit ein Tag-Wechsel plus erneutes `up -d`.
#
# Caddy sitzt davor und holt das TLS-Zertifikat selbst. Dafuer muss die
# Domain aus PUBLIC_DOMAIN auf diesen Server zeigen und 80/443 erreichbar
# sein -- Let's Encrypt prueft ueber genau diese beiden Ports.

# Docker dreht Logdateien von sich aus nicht: ohne diese Grenze waechst das
# Log jedes Dienstes unbegrenzt weiter, bis die Platte voll ist. Die API
# schreibt in Produktion eine Zeile pro Anfrage.
# Die Caddy-Konfiguration steht hier drin statt in einer eigenen Datei:
# so bleibt es bei einer Datei plus .env auf dem Server. ${PUBLIC_DOMAIN}
# setzt Docker Compose beim Start ein.
configs:
  caddyfile:
    content: |
      ${PUBLIC_DOMAIN} {
          reverse_proxy web:80

          # Sagt dem Browser, es kuenftig gar nicht erst ueber http zu
          # versuchen. Bewusst ohne includeSubDomains und preload -- die
          # beiden liessen sich nur schwer wieder zuruecknehmen.
          header Strict-Transport-Security "max-age=31536000"
      }

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${GITHUB_REPOSITORY}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}

      # Welchen vorgelagerten Adressen ihr X-Forwarded-For geglaubt wird.
      # "uniquelocal" = die privaten Netze, also der nginx aus dem web-Dienst
      # und ein TLS-Proxy auf demselben Rechner. Ohne das sieht die API bei
      # jedem Aufruf dieselbe Proxy-IP -- dann teilen sich alle Besucher ein
      # Rate-Limit und sperren sich gegenseitig aus.
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}

      # Nur fuer den einmaligen Seed-Lauf gefuellt (erster Administrator),
      # im Normalbetrieb leer -- siehe README, Abschnitt "Auf einem Server".
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}

      NODE_ENV: production
      PORT: 3000

    depends_on:
      db:
        condition: service_healthy

    expose:
      - '3000'

  web:
    image: ghcr.io/${GITHUB_REPOSITORY}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging

    # Nach aussen geht nur noch Caddy; hierher kommt man ueber das interne
    # Netz. Die Vorgabe oeffnet einen Zugang zum Nachsehen, der nur auf dem
    # Server selbst erreichbar ist -- nicht im Netz.
    ports:
      - '${WEB_PORT:-127.0.0.1:8080}:80'

    depends_on:
      api:
        condition: service_healthy

  # ------------------------------------------------------------------
  # TLS-Endpunkt. Holt und erneuert das Zertifikat selbstaendig und reicht
  # alles an den nginx im web-Dienst weiter -- auch die Socket-Verbindung,
  # dafuer ist nichts einzustellen.
  # ------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging

    ports:
      - '80:80'
      - '443:443'
      # HTTP/3 laeuft ueber UDP. Fehlt die Zeile, faellt der Browser
      # stillschweigend auf HTTP/2 zurueck.
      - '443:443/udp'

    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

    volumes:
      # Muss erhalten bleiben: hier liegen Zertifikat und ACME-Konto. Ohne
      # das beantragt Caddy nach jedem Neustart ein neues Zertifikat und
      # laeuft irgendwann in die Ausstellungsgrenzen von Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
